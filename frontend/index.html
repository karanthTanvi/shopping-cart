<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AUREL</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
  <div class="nav-left"></div>
  <div class="nav-center">
    <span class="logo">AUREL</span>
  </div>
  <div class="nav-right">
    <button class="cart-btn" id="cartToggle">
      BAG (<span id="cartCount">0</span>)
    </button>
  </div>
</nav>

<div class="tab-bar">
  <button class="tab-btn active" data-category="all">ALL PIECES</button>
  <button class="tab-btn" data-category="Rings">RINGS</button>
  <button class="tab-btn" data-category="Earrings">EARRINGS</button>
  <button class="tab-btn" data-category="Necklaces">NECKLACES</button>
  <button class="tab-btn" data-category="Bracelets">BRACELETS</button>
</div>

  <!-- PRODUCT GRID -->
  <main>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- PRODUCT DETAIL OVERLAY -->
  <div class="overlay" id="detailOverlay">
    <div class="detail-modal">
      <button class="detail-close" id="detailClose">✕</button>
      <div class="detail-image-wrap">
        <div class="detail-image-placeholder" id="detailImage"></div>
      </div>
      <div class="detail-info">
        <p class="detail-category" id="detailCategory"></p>
        <h2 class="detail-name" id="detailName"></h2>
        <p class="detail-price" id="detailPrice"></p>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="detail-meta">
          <div class="detail-row">
            <span class="detail-label">MATERIAL</span>
            <span class="detail-value" id="detailMaterial"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">REFERENCE</span>
            <span class="detail-value" id="detailReference"></span>
          </div>
        </div>
        <button class="add-btn" id="detailAddBtn">ADD TO BAG</button>
        <p class="detail-note">Complimentary shipping on all orders. Each piece arrives in an AUREL gift box.</p>
      </div>
    </div>
  </div>

  <!-- CART SIDEBAR -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <span class="cart-title">YOUR BAG</span>
      <button class="close-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter"></div>
  </aside>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
